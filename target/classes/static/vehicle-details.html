<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Details - JourneyMATE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #3b82f6;
            --secondary: #f8fafc;
            --accent: #06b6d4;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --dark: #0f172a;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            --white: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            line-height: 1.6;
            color: var(--gray-900);
            background: var(--gray-50);
        }

        /* Header */
        .header {
            background: white;
            border-bottom: 1px solid var(--gray-200);
            position: sticky;
            top: 0;
            z-index: 40;
            box-shadow: var(--shadow);
        }

        .header-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 80px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
            font-weight: 700;
        }

        .logo-text {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--gray-900);
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .nav-link {
            color: var(--gray-600);
            text-decoration: none;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-link:hover {
            color: var(--primary);
            background: var(--gray-100);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
        }

        .btn-outline {
            background: transparent;
            color: var(--gray-700);
            border: 2px solid var(--gray-300);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--gray-50);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Main Content */
        .main-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            color: var(--gray-600);
        }

        .breadcrumb a {
            color: var(--primary);
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        /* Vehicle Details */
        .vehicle-details {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            margin-bottom: 2rem;
        }

        .vehicle-gallery {
            position: relative;
            height: 400px;
            background: var(--gray-100);
        }

        .vehicle-main-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .vehicle-status-badge {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            color: white;
            backdrop-filter: blur(10px);
        }

        .status-available {
            background: rgba(16, 185, 129, 0.9);
        }

        .status-unavailable {
            background: rgba(239, 68, 68, 0.9);
        }

        .vehicle-info {
            padding: 2rem;
        }

        .vehicle-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
        }

        .vehicle-title {
            flex: 1;
        }

        .vehicle-name {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--gray-900);
            margin-bottom: 0.5rem;
        }

        .vehicle-type {
            color: var(--gray-600);
            font-size: 1.25rem;
            margin-bottom: 1rem;
        }

        .vehicle-id {
            color: var(--gray-500);
            font-size: 0.875rem;
        }

        .vehicle-pricing {
            text-align: right;
        }

        .price-amount {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
        }

        .price-period {
            color: var(--gray-500);
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        .price-note {
            color: var(--gray-600);
            font-size: 0.875rem;
        }

        /* Vehicle Specifications */
        .vehicle-specs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin: 2rem 0;
        }

        .spec-card {
            background: var(--gray-50);
            padding: 1.5rem;
            border-radius: 15px;
        }

        .spec-title {
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .spec-list {
            list-style: none;
        }

        .spec-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--gray-200);
        }

        .spec-item:last-child {
            border-bottom: none;
        }

        .spec-label {
            color: var(--gray-600);
        }

        .spec-value {
            font-weight: 600;
            color: var(--gray-900);
        }

        /* Booking Section */
        .booking-section {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: var(--shadow);
        }

        .booking-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .booking-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--gray-900);
            margin-bottom: 0.5rem;
        }

        .booking-subtitle {
            color: var(--gray-600);
        }

        .booking-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            align-items: center;
        }

        /* Loading State */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 400px;
            font-size: 1.125rem;
            color: var(--gray-600);
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--gray-300);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error State */
        .error-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--gray-500);
        }

        .error-icon {
            font-size: 4rem;
            color: var(--error);
            margin-bottom: 1rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header-container {
                padding: 0 1rem;
            }

            .nav {
                display: none;
            }

            .main-container {
                padding: 1rem;
            }

            .vehicle-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .vehicle-pricing {
                text-align: left;
            }

            .vehicle-name {
                font-size: 2rem;
            }

            .price-amount {
                font-size: 2rem;
            }

            .vehicle-specs {
                grid-template-columns: 1fr;
            }

            .booking-actions {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <a href="/user-home.html" class="logo">
                <div class="logo-icon">
                    <i class="fas fa-car"></i>
                </div>
                <span class="logo-text">JourneyMATE</span>
            </a>
            
            <nav class="nav">
                <a href="/user-home.html" class="nav-link">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </nav>
            
            <button class="btn btn-outline" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-container">
        <!-- Breadcrumb -->
        <nav class="breadcrumb">
            <a href="/user-home.html">
                <i class="fas fa-home"></i> Dashboard
            </a>
            <i class="fas fa-chevron-right"></i>
            <span>Vehicle Details</span>
        </nav>

        <!-- Vehicle Details Container -->
        <div id="vehicleContainer">
            <div class="loading">
                <div class="spinner"></div>
                Loading vehicle details...
            </div>
        </div>
    </main>

    <script>
        let vehicleData = null;
        let currentUser = null;

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            currentUser = localStorage.getItem('username');
            if (!currentUser) {
                window.location.href = '/index.html';
                return;
            }

            loadVehicleDetails();
        });

        // Load vehicle details from API
        async function loadVehicleDetails() {
            try {
                const vehicleId = localStorage.getItem('selectedVehicleId');
                
                if (!vehicleId) {
                    displayError('No vehicle selected');
                    return;
                }

                const response = await fetch(`/api/vehicles/${vehicleId}`);
                
                if (!response.ok) {
                    throw new Error('Vehicle not found');
                }

                vehicleData = await response.json();
                displayVehicleDetails(vehicleData);

            } catch (error) {
                console.error('Error loading vehicle details:', error);
                displayError('Failed to load vehicle details. Please try again.');
            }
        }

        // Display vehicle details
        function displayVehicleDetails(vehicle) {
            const container = document.getElementById('vehicleContainer');
            const isAvailable = vehicle.isAvailable || vehicle.status === 'AVAILABLE';
            const statusClass = isAvailable ? 'status-available' : 'status-unavailable';
            const statusText = isAvailable ? 'Available' : 'Not Available';

            container.innerHTML = `
                <!-- Vehicle Details -->
                <div class="vehicle-details">
                    <div class="vehicle-gallery">
                        <img src="${vehicle.imageUrl || 'https://images.unsplash.com/photo-1549924231-f129b911e442?q=80&w=1200&auto=format&fit=crop'}" 
                             alt="${vehicle.brandName} ${vehicle.modelName}" class="vehicle-main-image">
                        <div class="vehicle-status-badge ${statusClass}">
                            <i class="fas fa-${isAvailable ? 'check-circle' : 'times-circle'}"></i>
                            ${statusText}
                        </div>
                    </div>

                    <div class="vehicle-info">
                        <div class="vehicle-header">
                            <div class="vehicle-title">
                                <h1 class="vehicle-name">${vehicle.brandName} ${vehicle.modelName}</h1>
                                <p class="vehicle-type">${vehicle.vehicleType}</p>
                                <p class="vehicle-id">Vehicle ID: #${vehicle.id}</p>
                            </div>
                            <div class="vehicle-pricing">
                                <div class="price-amount">$${vehicle.rentalPricePerDay}</div>
                                <div class="price-period">per day</div>
                                <div class="price-note">Taxes and fees included</div>
                            </div>
                        </div>

                        <!-- Vehicle Specifications -->
                        <div class="vehicle-specs">
                            <div class="spec-card">
                                <h3 class="spec-title">
                                    <i class="fas fa-car"></i>
                                    Vehicle Information
                                </h3>
                                <ul class="spec-list">
                                    <li class="spec-item">
                                        <span class="spec-label">Brand</span>
                                        <span class="spec-value">${vehicle.brandName}</span>
                                    </li>
                                    <li class="spec-item">
                                        <span class="spec-label">Model</span>
                                        <span class="spec-value">${vehicle.modelName}</span>
                                    </li>
                                    <li class="spec-item">
                                        <span class="spec-label">Type</span>
                                        <span class="spec-value">${vehicle.vehicleType}</span>
                                    </li>
                                    <li class="spec-item">
                                        <span class="spec-label">Year</span>
                                        <span class="spec-value">${vehicle.year || 'N/A'}</span>
                                    </li>
                                </ul>
                            </div>

                            <div class="spec-card">
                                <h3 class="spec-title">
                                    <i class="fas fa-dollar-sign"></i>
                                    Pricing Details
                                </h3>
                                <ul class="spec-list">
                                    <li class="spec-item">
                                        <span class="spec-label">Daily Rate</span>
                                        <span class="spec-value">$${vehicle.rentalPricePerDay}</span>
                                    </li>
                                    <li class="spec-item">
                                        <span class="spec-label">Weekly Rate</span>
                                        <span class="spec-value">$${(vehicle.rentalPricePerDay * 7 * 0.9).toFixed(0)} <small>(10% off)</small></span>
                                    </li>
                                    <li class="spec-item">
                                        <span class="spec-label">Monthly Rate</span>
                                        <span class="spec-value">$${(vehicle.rentalPricePerDay * 30 * 0.8).toFixed(0)} <small>(20% off)</small></span>
                                    </li>
                                    <li class="spec-item">
                                        <span class="spec-label">Security Deposit</span>
                                        <span class="spec-value">$${Math.max(200, vehicle.rentalPricePerDay * 2)}</span>
                                    </li>
                                </ul>
                            </div>

                            <div class="spec-card">
                                <h3 class="spec-title">
                                    <i class="fas fa-info-circle"></i>
                                    Availability Status
                                </h3>
                                <ul class="spec-list">
                                    <li class="spec-item">
                                        <span class="spec-label">Status</span>
                                        <span class="spec-value" style="color: ${isAvailable ? 'var(--success)' : 'var(--error)'}">${statusText}</span>
                                    </li>
                                    <li class="spec-item">
                                        <span class="spec-label">Next Available</span>
                                        <span class="spec-value">${isAvailable ? 'Now' : 'TBD'}</span>
                                    </li>
                                    <li class="spec-item">
                                        <span class="spec-label">Booking Notice</span>
                                        <span class="spec-value">24 hours</span>
                                    </li>
                                    <li class="spec-item">
                                        <span class="spec-label">Max Duration</span>
                                        <span class="spec-value">30 days</span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Booking Section -->
                <div class="booking-section">
                    <div class="booking-header">
                        <h2 class="booking-title">Ready to Book?</h2>
                        <p class="booking-subtitle">${isAvailable ? 'This vehicle is available for immediate booking' : 'This vehicle is currently unavailable'}</p>
                    </div>

                    <div class="booking-actions">
                        <button class="btn btn-success" onclick="bookNow()" ${!isAvailable ? 'disabled' : ''}>
                            <i class="fas fa-calendar-plus"></i>
                            ${isAvailable ? 'Book Now' : 'Not Available'}
                        </button>
                        <button class="btn btn-outline" onclick="addToWishlist()">
                            <i class="fas fa-heart"></i>
                            Add to Wishlist
                        </button>
                        <button class="btn btn-outline" onclick="contactSupport()">
                            <i class="fas fa-phone"></i>
                            Contact Support
                        </button>
                    </div>
                </div>
            `;
        }

        // Book now function
        function bookNow() {
            if (!vehicleData) return;
            
            localStorage.setItem('bookingVehicleId', vehicleData.id);
            window.location.href = '/booking.html';
        }

        // Add to wishlist (placeholder)
        function addToWishlist() {
            alert('Wishlist feature coming soon!');
        }

        // Contact support (placeholder)
        function contactSupport() {
            alert('Support contact: +1 (555) 123-4567');
        }

        // Display error
        function displayError(message) {
            const container = document.getElementById('vehicleContainer');
            container.innerHTML = `
                <div class="error-state">
                    <div class="error-icon">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <h2>Error</h2>
                    <p>${message}</p>
                    <div style="margin-top: 2rem;">
                        <button class="btn btn-primary" onclick="window.location.href='/user-home.html'">
                            <i class="fas fa-arrow-left"></i> Back to Dashboard
                        </button>
                        <button class="btn btn-outline" onclick="loadVehicleDetails()">
                            <i class="fas fa-redo"></i> Try Again
                        </button>
                    </div>
                </div>
            `;
        }

        // Logout function
        function logout() {
            localStorage.removeItem('username');
            localStorage.removeItem('role');
            localStorage.removeItem('selectedVehicleId');
            window.location.href = '/index.html';
        }
    </script>
</body>
</html>
